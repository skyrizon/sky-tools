services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skytools
      POSTGRES_PASSWORD: skytools_dev
      POSTGRES_DB: skytools
    ports:
      - "5433:5432"
    volumes:
      - skytools_pgdata:/var/lib/postgresql/data

volumes:
  skytools_pgdata:
