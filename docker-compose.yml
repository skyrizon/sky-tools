services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudtools
      POSTGRES_PASSWORD: cloudtools_dev
      POSTGRES_DB: cloudtools
    ports:
      - "5433:5432"
    volumes:
      - cloudtools_pgdata:/var/lib/postgresql/data

volumes:
  cloudtools_pgdata:
